name: "Good first issue: contoh kalkulator"
description: "Tambahkan contoh kalkulator pemula memakai tanya dan percabangan resmi."
labels: ["good first issue"]
title: "[Good First Issue] Tambahkan contoh kalkulator .cuk dengan tanya dan njir"
body:
  - type: markdown
    attributes:
      value: |
        Tambahkan `examples/kalkulator.cuk` yang ramah pemula. Keyword percabangan kanonis di `SPEC.md` adalah `njir`, `kampret`, dan `selesai njir`; jangan menambahkan keyword `jika` tanpa perubahan kontrak bahasa yang disetujui.
  - type: textarea
    id: plan
    attributes:
      label: Rencana singkat
      description: Bagaimana contoh akan meminta input, menghitung, dan menangani input yang tidak valid?
      placeholder: "Minta dua angka dengan tanya, lalu pilih operasi..."
    validations:
      required: true
  - type: checkboxes
    id: done
    attributes:
      label: Kriteria selesai
      options:
        - label: Contoh mengikuti sintaks aktual di SPEC.md.
          required: true
        - label: Input dan operator tidak valid ditangani dengan pesan ramah.
          required: true
        - label: Perintah untuk menjalankan contoh didokumentasikan.
          required: true
