name: Build Accounting Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/accounting
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify generated .cuk rules and accounting core
        run: npm run test:core
      - name: Package Windows portable executable
        run: npm run dist:win
      - name: Verify package exists
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe
          if (-not $files -or $files.Count -eq 0) { throw "No Windows EXE was produced." }
          $files | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Windows EXE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.1
        with:
          name: PusingCuk-Accounting-Windows
          path: apps/accounting/dist/*.exe
          if-no-files-found: error
          retention-days: 14
