name: Android native runtime

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "scripts/build-android.sh"
      - "halo.cuk"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "native/**"
      - "scripts/build-android.sh"
      - "halo.cuk"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pusingcuk-android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018"

      - name: Cross-compile and validate Android binaries
        run: |
          set -euo pipefail
          bash scripts/build-android.sh dist/android
          test -s dist/android/pusingcuk-native-android-arm64
          test -s dist/android/pusingcuk-native-android-x86_64
          test "$(stat -c '%a' dist/android/pusingcuk-native-android-arm64)" = "755"
          test "$(stat -c '%a' dist/android/pusingcuk-native-android-x86_64)" = "755"

      - name: Smoke-test native runtime on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -eu
            adb push dist/android/pusingcuk-native-android-x86_64 /data/local/tmp/pusingcuk-native
            adb push halo.cuk /data/local/tmp/halo.cuk
            adb shell chmod 755 /data/local/tmp/pusingcuk-native
            version="$(adb shell /data/local/tmp/pusingcuk-native --version | tr -d '\r')"
            printf '%s\n' "$version"
            printf '%s\n' "$version" | grep -Fq 'Pusingcuk native 0.7.1-android'
            output="$(adb shell /data/local/tmp/pusingcuk-native /data/local/tmp/halo.cuk | tr -d '\r')"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -Fqx 'Halo, Dunia'
            printf '%s\n' "$output" | grep -Fqx '42'

      - name: Upload Android native binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pusingcuk-android-native
          path: dist/android/pusingcuk-native-android-*
          if-no-files-found: error
          retention-days: 14
