name: Deferred Android Studio APK build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pusingcuk-android-studio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ambil kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Siapkan Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Siapkan Android SDK dan NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Pasang Android SDK/NDK yang dibutuhkan
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.9"
      - name: Bangun runtime native Android ARM
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android24-clang"
          mkdir -p android-studio/app/src/main/assets/bin/arm64-v8a
          "$NDK_BIN/aarch64-linux-android24-clang" -std=c11 -O2 -Wall -Wextra native/pusingcuk.c -lm -o android-studio/app/src/main/assets/bin/arm64-v8a/pusingcuk-native
          chmod 755 android-studio/app/src/main/assets/bin/arm64-v8a/pusingcuk-native
          mkdir -p android-studio/app/src/main/assets/bin/armeabi-v7a
          "$NDK_BIN/armv7a-linux-androideabi24-clang" -std=c11 -O2 -Wall -Wextra native/pusingcuk.c -lm -o android-studio/app/src/main/assets/bin/armeabi-v7a/pusingcuk-native
          chmod 755 android-studio/app/src/main/assets/bin/armeabi-v7a/pusingcuk-native
          file android-studio/app/src/main/assets/bin/*/pusingcuk-native
      - name: Bangun APK debug
        working-directory: android-studio
        run: gradle --no-daemon assembleDebug
      - name: Periksa APK
        run: |
          set -euo pipefail
          APK=android-studio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='org.pusingcuk.studio'"
      - name: Unggah APK debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pusingcuk-studio-debug-apk
          path: android-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
