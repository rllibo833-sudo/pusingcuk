name: Encrypted CORE Supabase backup

# Manual only. Never runs on push, pull_request, or a schedule.
on:
  workflow_dispatch:
    inputs:
      confirm_scope:
        description: "Confirm the database being exported"
        required: true
        type: choice
        options:
          - "Kawasan-masjid-1000ha (lnpzgrodwnhthcwudebk)"

permissions:
  contents: read

concurrency:
  group: encrypted-core-supabase-backup
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_scope == 'Kawasan-masjid-1000ha (lnpzgrodwnhthcwudebk)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Export, encrypt, and verify database archive
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          set +x
          : "${SUPABASE_DB_URL:?Add SUPABASE_DB_URL in repository Actions secrets}"
          : "${BACKUP_ENCRYPTION_PASSPHRASE:?Add BACKUP_ENCRYPTION_PASSPHRASE in repository Actions secrets}"
          if [[ "${SUPABASE_DB_URL}" != postgres://* && "${SUPABASE_DB_URL}" != postgresql://* ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI."
            exit 1
          fi
          if (( ${#BACKUP_ENCRYPTION_PASSPHRASE} < 32 )); then
            echo "::error::Use a randomly generated backup passphrase of at least 32 characters."
            exit 1
          fi

          umask 077
          backup_root="$RUNNER_TEMP/supabase-db-backup"
          mkdir -p "$backup_root"
          chmod 700 "$backup_root"
          dump_file="$backup_root/kawasan-masjid-1000ha.dump"
          encrypted_file="$backup_root/kawasan-masjid-1000ha.dump.enc"
          roundtrip_file="$backup_root/roundtrip.dump"
          hmac_file="$backup_root/kawasan-masjid-1000ha.dump.enc.hmac"
          manifest_file="$backup_root/backup-manifest.txt"
          trap 'rm -f "$dump_file" "$roundtrip_file"' EXIT

          # The URL and password exist only in an environment variable; do not echo them.
          docker run --rm \
            --env SUPABASE_DB_URL \
            --volume "$backup_root:/backup" \
            postgres:17-alpine \
            sh -euc 'pg_dump --dbname="$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --file=/backup/kawasan-masjid-1000ha.dump'

          test -s "$dump_file"

          # Encrypt before any artifact upload. The passphrase never enters the artifact.
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            -in "$dump_file" -out "$encrypted_file"

          # Authenticated integrity check for the encrypted file using the private passphrase.
          hmac_value="$(openssl dgst -sha256 -hmac "$BACKUP_ENCRYPTION_PASSPHRASE" "$encrypted_file" | awk '{print $NF}')"
          printf '%s  %s\n' "$hmac_value" "$(basename "$encrypted_file")" > "$hmac_file"
          hmac_check="$(openssl dgst -sha256 -hmac "$BACKUP_ENCRYPTION_PASSPHRASE" "$encrypted_file" | awk '{print $NF}')"
          test "$hmac_check" = "$(awk '{print $1}' "$hmac_file")"

          # Decrypt into the ephemeral runner and verify the PostgreSQL archive TOC.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            -in "$encrypted_file" -out "$roundtrip_file"
          docker run --rm \
            --volume "$backup_root:/backup" \
            postgres:17-alpine \
            pg_restore --list /backup/roundtrip.dump > "$backup_root/archive-toc.txt"
          test -s "$backup_root/archive-toc.txt"
          rm -f "$backup_root/archive-toc.txt"

          {
            printf 'backup_scope=Kawasan-masjid-1000ha (lnpzgrodwnhthcwudebk)\n'
            printf 'created_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'format=pg_dump custom archive, PostgreSQL 17 client\n'
            printf 'encryption=AES-256-CBC with PBKDF2 (600000 iterations)\n'
            printf 'integrity=HMAC-SHA256; decryption and pg_restore --list verified\n'
            printf 'plain_database_dump_in_artifact=no\n'
            printf 'full_restore_test=not_performed\n'
            printf 'storage_object_bytes_edge_function_code_and_provider_secrets=not_included\n'
            printf 'encrypted_sha256=%s\n' "$(sha256sum "$encrypted_file" | awk '{print $1}')"
          } > "$manifest_file"

      - name: Upload encrypted archive only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kawasan-supabase-encrypted-backup
          path: |
            ${{ runner.temp }}/supabase-db-backup/kawasan-masjid-1000ha.dump.enc
            ${{ runner.temp }}/supabase-db-backup/kawasan-masjid-1000ha.dump.enc.hmac
            ${{ runner.temp }}/supabase-db-backup/backup-manifest.txt
          if-no-files-found: error
          retention-days: 3
