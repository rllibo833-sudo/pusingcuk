name: PyInstaller build test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install build dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pyinstaller==6.11.1
          fi
      - name: Inspect repository files
        run: ls -R
      - name: Build executable
        run: |
          pyinstaller pusingcuk.spec --noconfirm || pyinstaller --onefile pusingcuk_new.py --name pusingcuk --add-data "examples:examples" --hidden-import evaluator --hidden-import parser --hidden-import tools.formatter
      - name: Verify executable
        run: |
          if [ ! -x dist/pusingcuk ]; then
            echo "::error::PyInstaller did not produce an executable at dist/pusingcuk"
            exit 1
          fi
