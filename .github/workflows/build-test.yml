name: PyInstaller build test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pyinstaller==6.11.1
          fi
      - name: Verify installable Python CLI
        run: |
          set -euo pipefail
          python -m pip install --no-deps .
          cp halo.cuk "$RUNNER_TEMP/halo.cuk"
          cd "$RUNNER_TEMP"
          pusingcuk --check "$RUNNER_TEMP/halo.cuk"
          output="$(pusingcuk "$RUNNER_TEMP/halo.cuk")"
          printf '%s\n' "$output"
          grep -Fqx 'Halo, Dunia' <<< "$output"
          grep -Fqx '42' <<< "$output"
          python -c "from library.builtin_contract import BUILTIN_CONTRACT; assert BUILTIN_CONTRACT['schema_version'] == 1"
      - name: Build executable
        run: pyinstaller --log-level DEBUG --noconfirm --clean pusingcuk.spec
      - name: Verify executable
        run: test -x dist/pusingcuk
