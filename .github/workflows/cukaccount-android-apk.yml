name: CukAccount Android APK

on:
  # Only rebuild for files that affect this APK; keep unrelated commits cheap.
  push:
    branches: [main]
    paths:
      - ".github/workflows/cukaccount-android-apk.yml"
      - "apps/cukaccount-android/**"
      - "apps/accounting/index.html"
      - "apps/accounting/accounting-core.js"
      - "examples/accounting/aturan_ringkasan.cuk"
      - "compiler/js_backend.py"
      - "compiler/ir.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cukaccount-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.9"
      - name: Compile registered .cuk accounting rule and stage offline UI
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=apps/cukaccount-android/app/src/main/assets
          mkdir -p "$ASSETS"
          python -m compiler.js_backend examples/accounting/aturan_ringkasan.cuk --module -o "$ASSETS/accounting-rules.generated.js"
          cp apps/accounting/index.html "$ASSETS/index.html"
          cp apps/accounting/accounting-core.js "$ASSETS/accounting-core.js"
          test -s "$ASSETS/index.html"
          test -s "$ASSETS/accounting-core.js"
          test -s "$ASSETS/accounting-rules.generated.js"
      - name: Build CukAccount debug APK
        working-directory: apps/cukaccount-android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/cukaccount-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='id.cukaccount.app'"
          sha256sum "$APK"
      - name: Upload CukAccount APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cukaccount-android-debug-apk
          path: apps/cukaccount-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
