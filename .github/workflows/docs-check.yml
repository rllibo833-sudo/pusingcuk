name: docs-check
on:
  push:
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs-check.yml"
      - "tools/generate_compatibility.py"
      - "tests/conformance/baseline_summary.json"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs-check.yml"
      - "tools/generate_compatibility.py"
      - "tests/conformance/baseline_summary.json"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated compatibility snapshot
        run: python tools/generate_compatibility.py --check
      - name: Validate changed documentation is non-empty and has no conflict markers
        shell: bash
        run: |
          if git diff --name-only origin/main | grep -qE "\.md$|^docs/"; then
            echo "docs changed - checking"
            ! grep -R "<<<<<<" docs/ || exit 1
          fi
