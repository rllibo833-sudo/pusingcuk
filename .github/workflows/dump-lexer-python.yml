name: dump lexer opcodes with reference Python compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile using reference Python compiler and dump opcodes
        shell: bash
        run: |
          python - <<'PY' | tee /tmp/dump.txt
          import json
          from collections import Counter
          from pathlib import Path
          from compiler.bytecode import compile_source, validate_bytecode

          source_path = Path("examples/self_hosting/source_lexer.cuk")
          source = source_path.read_text(encoding="utf-8")
          artifact = compile_source(source, source_path.name)
          validate_bytecode(artifact)
          Path("/tmp/lexer.pvm").write_text(
              json.dumps(artifact, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"format: {artifact['format']}")
          print(f"bytecode_version: {artifact['bytecode_version']}")
          print(f"source_name: {artifact['source_name']}")
          counts = Counter()

          def dump_code(label, code):
              print(f"\n## {label} ({len(code)} instructions)")
              for pc, instruction in enumerate(code):
                  op, arg, line = instruction
                  counts[op] += 1
                  print(f"{pc:04d} line={line:<4} {op:<16} {json.dumps(arg, ensure_ascii=False)}")

          dump_code("<module>", artifact["code"])
          for name, function in artifact["functions"].items():
              dump_code(f"function {name}", function["code"])
          print("\n## OPCODE COUNTS")
          for op, count in sorted(counts.items()):
              print(f"{op}: {count}")
          print(f"TOTAL_INSTRUCTIONS: {sum(counts.values())}")
          print(f"UNIQUE_OPCODES: {len(counts)}")
          PY
      - name: Upload bytecode and dump
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lexer-dump-python
          path: |
            /tmp/dump.txt
            /tmp/lexer.pvm
          if-no-files-found: error
          retention-days: 7
