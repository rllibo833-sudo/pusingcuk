name: Example syntax check

on:
  push:
    paths:
      - "examples/**/*.cuk"
      - "examples/*.cuk"
      - "pusingcuk_new.py"
      - "lexer.py"
      - "parser.py"
      - "ast_nodes.py"
      - "SPEC.md"
      - ".github/workflows/example-check.yml"
  pull_request:
    paths:
      - "examples/**/*.cuk"
      - "examples/*.cuk"
      - "pusingcuk_new.py"
      - "lexer.py"
      - "parser.py"
      - "ast_nodes.py"
      - "SPEC.md"
      - ".github/workflows/example-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every .cuk example
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "::group::Checking $file"
            python pusingcuk_new.py --check "$file"
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find examples -type f -name '*.cuk' -print0 | sort -z)
          test "$count" -gt 0
          echo "Checked $count .cuk example files."
      - name: Execute curated deterministic beginner examples
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          cases = {
              "examples/hello.cuk": "Halo, Dunia\n",
              "examples/warung.cuk": "WARUNG DIGITAL\nTotal transaksi:\n13000\nStatus: transaksi aman\n",
              "examples/rekap_anggaran.cuk": "REKAP ANGGARAN BULANAN\nPendapatan:\n2500000\nTotal pengeluaran:\n1200000\nSisa anggaran:\n1300000\nStatus: anggaran aman\n",
          }
          for filename, expected in cases.items():
              proc = subprocess.run(
                  [sys.executable, "pusingcuk_new.py", filename],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=8, check=False,
              )
              if proc.returncode != 0 or proc.stderr or proc.stdout != expected:
                  print(f"FAIL {filename}", file=sys.stderr)
                  print(f"exit={proc.returncode}", file=sys.stderr)
                  print(f"expected={expected!r}", file=sys.stderr)
                  print(f"stdout={proc.stdout!r}", file=sys.stderr)
                  print(f"stderr={proc.stderr!r}", file=sys.stderr)
                  raise SystemExit(1)
              print(f"PASS {filename}")
          PY
