name: Experimental PVM checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pusingcuk-experimental-pvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pvm-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Siapkan Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verifikasi assembler dan kesetaraan backend PVM
        run: bash tests/test_all.sh
