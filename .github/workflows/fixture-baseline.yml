name: PusingCuk fixture baseline matrix
on:
  pull_request:
    paths:
      - ".github/workflows/fixture-baseline.yml"
      - "SPEC.md"
      - "lexer.py"
      - "pusingcuk/lexer.py"
      - "parser.py"
      - "evaluator.py"
      - "compiler/**"
      - "native/**"
      - "library/**"
      - "tests/conformance/**"
      - "tools/ci_fixture_matrix.py"
      - "tools/conformance.py"
      - "tools/differential_runner.py"
      - "tools/check_fixture_regression.py"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fixture-baseline.yml"
      - "SPEC.md"
      - "lexer.py"
      - "pusingcuk/lexer.py"
      - "parser.py"
      - "evaluator.py"
      - "compiler/**"
      - "native/**"
      - "library/**"
      - "tests/conformance/**"
      - "tools/ci_fixture_matrix.py"
      - "tools/conformance.py"
      - "tools/differential_runner.py"
      - "tools/check_fixture_regression.py"
jobs:
  matrix:
    runs-on: ubuntu-latest
    env:
      PUSINGCUK_MATRIX_OUT: artifacts/fixture-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/ci_fixture_matrix.py
      - name: Generate differential parity report
        if: always()
        run: python tools/differential_runner.py artifacts/fixture-matrix/results.json --output artifacts/fixture-matrix/differential.json
      - name: Check fixture pass-count regression
        id: regression
        if: always()
        run: python tools/check_fixture_regression.py artifacts/fixture-matrix/summary.json tests/conformance/baseline_summary.json
      - name: Upload fixture matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pusingcuk-fixture-matrix-${{ github.sha }}
          path: |
            artifacts/fixture-matrix/results.xml
            artifacts/fixture-matrix/matrix_results.json
            artifacts/fixture-matrix/results.json
            artifacts/fixture-matrix/summary.json
            artifacts/fixture-matrix/raw.log
            artifacts/fixture-matrix/differential.json
          if-no-files-found: warn
          retention-days: 14
