name: PusingCuk fixture baseline matrix
on:
  pull_request:
    paths:
      - "tools/ci_fixture_matrix.py"
      - "tools/differential_runner.py"
      - ".github/workflows/fixture-baseline.yml"
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  matrix:
    runs-on: ubuntu-latest
    env:
      PUSINGCUK_MATRIX_OUT: artifacts/fixture-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/ci_fixture_matrix.py
      - name: Generate differential parity report
        if: always()
        run: python tools/differential_runner.py artifacts/fixture-matrix/results.json --output artifacts/fixture-matrix/differential.json
      - name: Check fixture pass-count regression
        id: regression
        if: always()
        run: python tools/check_regression.py || true
