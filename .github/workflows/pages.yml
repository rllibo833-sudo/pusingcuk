name: Publish PusingCuk website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pusingcuk_new.py"
      - "evaluator.py"
      - "parser.py"
      - "lexer.py"
      - "ast_nodes.py"
      - "library/stdlib.py"
      - "library/builtin_contract.py"
      - "library/builtin_contract.json"
      - "tools/prepare_playground.py"
      - "tools/check_playground_examples.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pusingcuk-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify browser gallery against reference interpreter
        run: python tools/check_playground_examples.py
      - name: Bundle reference interpreter modules for Pyodide
        run: python tools/prepare_playground.py
      - name: Verify generated browser runtime is deployable
        run: |
          grep -q 'ssl = None' site/runtime/evaluator.py
          test -s site/runtime/library/builtin_contract.json
          grep -q 'library/builtin_contract.json' site/playground.html
          grep -q 'BUILD_ID=' site/playground.html
      - name: Verify reference interpreter example
        run: |
          python pusingcuk_new.py site/examples/halo.pusingcuk > /tmp/halo-reference.txt
          test "$(cat /tmp/halo-reference.txt)" = "Halo, Dunia"
      - name: Verify getting-started JavaScript compiler command
        run: |
          python -m compiler site/examples/halo.pusingcuk --target js --output /tmp/halo.js
          test "$(node /tmp/halo.js)" = "Halo, Dunia"
      - name: Compile PusingCuk example to standalone HTML
        run: python -m compiler site/examples/halo.pusingcuk --target html --output site/demo.html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        # Pages must be enabled manually in repository Settings → Pages.
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
