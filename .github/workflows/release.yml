name: Release binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish"
        required: true
        default: "v0.7.1"
        type: string

permissions:
  contents: write

concurrency:
  group: pusingcuk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # Do not enable setup-python's pip cache: this repo has no
          # requirements.txt or pyproject.toml, so cache key discovery fails.

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pyinstaller==6.11.1

      - name: Inspect build inputs
        run: ls -R

      - name: Set up Java for Android NDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018"

      - name: Build Android ARM64 native executable
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist/android
          "$NDK_BIN/aarch64-linux-android24-clang" -std=c11 -O2 -Wall -Wextra -Werror \
            -DPUSINGCUK_VERSION='"0.7.1-android"' \
            native/pusingcuk.c -lm -o dist/android/pusingcuk-native-android-arm64
          chmod 755 dist/android/pusingcuk-native-android-arm64
          file dist/android/pusingcuk-native-android-arm64
          readelf -h dist/android/pusingcuk-native-android-arm64 | grep -q 'Machine:.*AArch64'
          dist/android/pusingcuk-native-android-arm64 --version
          sha256sum dist/android/pusingcuk-native-android-arm64

      - name: Build standalone executable (spec, with one-file fallback)
        shell: bash
        run: |
          set -euo pipefail
          if pyinstaller --noconfirm --clean --log-level DEBUG pusingcuk.spec; then
            echo "Built executable using pusingcuk.spec"
          else
            echo "::warning::Spec build failed; retrying with explicit one-file configuration"
            rm -rf build dist
            pyinstaller --noconfirm --clean --log-level DEBUG --onefile pusingcuk_new.py \
              --name pusingcuk \
              --add-data "examples:examples" \
              --hidden-import evaluator \
              --hidden-import parser \
              --hidden-import lexer \
              --hidden-import ast_nodes \
              --hidden-import tools \
              --hidden-import tools.formatter
          fi

      - name: Verify executable and bundled example
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/pusingcuk
          chmod +x dist/pusingcuk
          output="$(./dist/pusingcuk examples/modular.pusingcuk)"
          printf '%s\n' "$output"
          grep -Fq 'Halo, Budi!' <<< "$output"
          grep -Fq 'selesai' <<< "$output"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RELEASE_TAG - Linux x86-64 PyInstaller CLI plus Android ARM64 native CLI built with Android NDK API 24. The Android binary is a subset runtime, not a sandbox; Termux device testing must be completed by maintainers/users. Run Linux: ./pusingcuk examples/modular.pusingcuk; Android/Termux: chmod +x pusingcuk-native-android-arm64 && ./pusingcuk-native-android-arm64 program.cuk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/pusingcuk dist/android/pusingcuk-native-android-arm64 --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" dist/pusingcuk dist/android/pusingcuk-native-android-arm64 \
              --title "$RELEASE_TAG" \
              --notes "$notes"
          fi
