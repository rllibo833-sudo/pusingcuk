name: Release binary

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pusingcuk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then release_tag="$INPUT_TAG"; else release_tag="$REF_NAME"; fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $release_tag"
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.release_tag }}

      - name: Verify checked-out revision
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pyinstaller==6.11.1

      - name: Build standalone executable with contract data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          pyinstaller --noconfirm --clean --log-level DEBUG --onefile pusingcuk_new.py \
            --name pusingcuk \
            --add-data "library/builtin_contract.json:library" \
            --add-data "library/kosakata.json:library" \
            --add-data "examples:examples" \
            --hidden-import evaluator \
            --hidden-import parser \
            --hidden-import lexer \
            --hidden-import ast_nodes \
            --hidden-import library.stdlib \
            --hidden-import library.builtin_contract \
            --hidden-import tools \
            --hidden-import tools.formatter

      - name: Verify executable and bundled example
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/pusingcuk
          chmod +x dist/pusingcuk
          output="$(./dist/pusingcuk examples/modular.pusingcuk)"
          printf '%s\n' "$output"
          grep -Fq 'Halo, Budi!' <<< "$output"
          grep -Fq 'selesai' <<< "$output"
          checkout_output="$(./dist/pusingcuk examples/kasir_warung.cuk)"
          expected_checkout="$(printf '40000\n4000\n36000\n3960\n39960')"
          test "$checkout_output" = "$expected_checkout"
          printf '%s\n' "$checkout_output"

      - name: Set up Java for Android NDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018"

      - name: Build Android ARM64 native executable
        shell: bash
        env:
          PUSINGCUK_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ANDROID_VERSION="${PUSINGCUK_RELEASE_TAG#v}-android"
          if [[ -f scripts/build-android.sh ]]; then
            PUSINGCUK_VERSION="$ANDROID_VERSION" bash scripts/build-android.sh dist/android
          else
            # Recovery path for historical tags predating the shared build script.
            mkdir -p dist/android
            VERSION_DEFINE="-DPUSINGCUK_VERSION=\"${ANDROID_VERSION}\""
            "$NDK_BIN/aarch64-linux-android24-clang" -std=c11 -O2 -Wall -Wextra -Werror \
              "$VERSION_DEFINE" \
              native/pusingcuk.c -lm -o dist/android/pusingcuk-native-android-arm64
            chmod 755 dist/android/pusingcuk-native-android-arm64
          fi
          test -s dist/android/pusingcuk-native-android-arm64
          file dist/android/pusingcuk-native-android-arm64
          readelf -h dist/android/pusingcuk-native-android-arm64 | grep -q 'Machine:.*AArch64'
          strings dist/android/pusingcuk-native-android-arm64 | grep -Fq "$ANDROID_VERSION"
          sha256sum dist/android/pusingcuk-native-android-arm64

      - name: Package source snapshot
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="pusingcuk-${RELEASE_TAG}/" \
            --output="dist/pusingcuk-source-${RELEASE_TAG}.tar.gz" "${RELEASE_TAG}"
          test -s "dist/pusingcuk-source-${RELEASE_TAG}.tar.gz"

      - name: Upload validated release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pusingcuk-release-assets
          path: |
            dist/pusingcuk
            dist/android/pusingcuk-native-android-arm64
            dist/pusingcuk-source-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pusingcuk-release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/pusingcuk
          test -s dist/android/pusingcuk-native-android-arm64
          test -s "dist/pusingcuk-source-${RELEASE_TAG}.tar.gz"
          notes="$RELEASE_TAG - Experimental Linux x86-64 CLI, Android ARM64 native CLI, and source archive. The native runtime is a subset, not an OS sandbox; do not run untrusted programs."
          # This job does not check out the repository, so pass the target repo explicitly.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/pusingcuk dist/android/pusingcuk-native-android-arm64 "dist/pusingcuk-source-${RELEASE_TAG}.tar.gz" \
              --repo "$GITHUB_REPOSITORY" --clobber
            # Preserve curated title and release notes when retrying an existing release; only replace assets.
          else
            gh release create "$RELEASE_TAG" dist/pusingcuk dist/android/pusingcuk-native-android-arm64 "dist/pusingcuk-source-${RELEASE_TAG}.tar.gz" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes "$notes"
          fi
