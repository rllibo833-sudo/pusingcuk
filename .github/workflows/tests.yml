name: Tes Pusingcuk

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pusingcuk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Jalankan semua tes referensi
        run: python -m unittest discover -s tests -v

  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Verifikasi compiler
        run: ${{ matrix.compiler }} --version
      - name: Kompilasi dan uji runtime native
        run: make test-native
      - name: Uji konformansi lintas runtime
        run: python tools/conformance.py
