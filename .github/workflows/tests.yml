name: PusingCuk core
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tests.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "pusingcuk_new.py"
      - "interpreter.py"
      - "evaluator.py"
      - "lexer.py"
      - "scripts/check_alias_sync.py"
      - "scripts/gen_docs_from_spec.py"
      - "docs/AI_ENGINE_READINESS.md"
      - "docs/**"
      - "docs/COMPATIBILITY.md"
      - "docs/CONFORMANCE_FIXTURES.md"
      - "tools/evolve_daemon.py"
      - "tools/evolve_language.py"
      - "parser.py"
      - "ast_nodes.py"
      - "compiler/**"
      - "library/**"
      - "native/**"
      - "tests/**"
      - "tools/conformance.py"
      - "tools/diagnostic_repair_loop.py"
      - "tools/local_ai_adapter.py"
      - "tools/reality_engine.py"
      - "examples/**"
      - "halo.cuk"
      - "Makefile"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "pusingcuk_new.py"
      - "evaluator.py"
      - "lexer.py"
      - "parser.py"
      - "ast_nodes.py"
      - "compiler/**"
      - "library/**"
      - "native/**"
      - "tests/**"
      - "tools/conformance.py"
      - "tools/diagnostic_repair_loop.py"
      - "tools/local_ai_adapter.py"
      - "tools/reality_engine.py"
      - "examples/**"
      - "halo.cuk"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pusingcuk-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_alias_sync.py
      - run: python scripts/gen_docs_from_spec.py --check
      - run: python -m unittest discover -s tests -v
      - if: matrix.python-version == '3.12'
        run: python tools/conformance.py
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-native
