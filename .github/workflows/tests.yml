name: PusingCuk core (Docker)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "*.py"
      - "scripts/**"
      - "tools/**"
      - "site/**"
      - "requirements*.txt"
      - "setup.py"
      - "pusingcuk.spec"
      - "MANIFEST.in"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "compiler/**"
      - "library/**"
      - "native/**"
      - "tests/**"
      - "examples/**"
      - "halo.cuk"
      - "Makefile"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "*.py"
      - "scripts/**"
      - "tools/**"
      - "site/**"
      - "requirements*.txt"
      - "setup.py"
      - "pusingcuk.spec"
      - "MANIFEST.in"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "compiler/**"
      - "library/**"
      - "native/**"
      - "tests/**"
      - "examples/**"
      - "halo.cuk"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pusingcuk-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the canonical development image
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python-version }} -t pusingcuk-ci .
      - name: Run all repository gates inside Docker
        run: |
          docker run --rm -e CC=${{ matrix.compiler }} pusingcuk-ci sh -lc '
            set -eu
            python scripts/check_alias_sync.py
            python scripts/gen_docs_from_spec.py --check
            python tools/validate_target_manifests.py
            python -m unittest discover -s tests -v
            if python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 1)"; then
              python tools/conformance.py
            fi
            make test-native
          '
