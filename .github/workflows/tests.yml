name: Tes Pusingcuk

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pusingcuk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Ambil kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Siapkan Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pasang pytest
        run: python -m pip install pytest
      - name: Jalankan suite pytest
        run: python -m pytest -q
      - name: Jalankan gate lengkap
        run: make test
      - name: Uji contoh file I/O dengan input dummy
        run: |
          set -euo pipefail
          output="$(echo -e "Budi\nBeli kopi" | python pusingcuk_new.py examples/file_io.pusingcuk)"
          printf '%s\n' "$output"
          grep -Fq 'Budi : Beli kopi' <<< "$output"
          rm -f warung.txt

      - name: Uji contoh JSON I/O Level 3.5
        run: |
          set -euo pipefail
          output="$(python pusingcuk_new.py examples/database.pusingcuk)"
          printf '%s\n' "$output"
          grep -Fq 'Budi' <<< "$output"
          grep -Fq '15000' <<< "$output"
          rm -f database.json

      # examples/internet.pusingcuk is an opt-in demo; core CI must not require network access.

      - name: Uji contoh modular Level 4
        run: |
          set -euo pipefail
          output="$(python pusingcuk_new.py examples/modular.pusingcuk)"
          printf '%s\n' "$output"
          grep -Fq 'Halo, Budi!' <<< "$output"
          grep -Fq 'selesai' <<< "$output"

  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verifikasi compiler
        run: ${{ matrix.compiler }} --version
      - name: Kompilasi dan uji runtime native
        run: make test-native
      - name: Uji konformansi lintas runtime
        run: python tools/conformance.py

  pvm-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Siapkan Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Siapkan Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Uji pembatasan file PVM dan kesetaraan backend
        run: bash tests/test_all.sh
