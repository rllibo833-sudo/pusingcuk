name: verify driver native JSON
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Compile driver to PVM
        run: |
          set -x
          python -m compiler --help
          python -m compiler --target vm -o /tmp/driver_lexer.pvm examples/self_hosting/driver_lexer_minimal.cuk
          echo "=== COMPILE RESULT ==="
          ls -lh /tmp/driver_lexer.pvm
          wc -c /tmp/driver_lexer.pvm
          head -c 500 /tmp/driver_lexer.pvm
      - name: Build native VM
        run: make -C native
      - name: Run native VM
        run: |
          set -o pipefail
          ./native/pusingcuk --run-bytecode /tmp/driver_lexer.pvm | tee /tmp/tokens_native.json
          cat /tmp/tokens_native.json
          python -m json.tool /tmp/tokens_native.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tokens-native
          path: /tmp/tokens_native.json
