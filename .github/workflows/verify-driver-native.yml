name: verify driver native JSON
on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/self_hosting/driver_lexer.cuk'
      - 'examples/self_hosting/driver_lexer_minimal.cuk'
      - 'examples/self_hosting/compiler.cuk'
      - 'native/**'
      - 'compiler/**'
      - '.github/workflows/verify-driver-native.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Compile driver to PVM
        run: |
          set -x
          python -m compiler --help
          python -m compiler --emit-bytecode /tmp/driver_lexer.pvm examples/self_hosting/driver_lexer_minimal.cuk
          echo "=== COMPILE RESULT ==="
          ls -lh /tmp/driver_lexer.pvm
          wc -c /tmp/driver_lexer.pvm
          head -c 500 /tmp/driver_lexer.pvm
      - name: Build native
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Run native VM
        run: |
          set -o pipefail
          ./build/pusingcuk-native --run-bytecode /tmp/driver_lexer.pvm | tee /tmp/tokens_native.json
          cat /tmp/tokens_native.json
          python -m json.tool /tmp/tokens_native.json
      - uses: actions/upload-artifact@v4
        with:
          name: tokens-native
          path: /tmp/tokens_native.json
