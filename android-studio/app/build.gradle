plugins { id 'com.android.application' }

android {
    namespace 'org.pusingcuk.studio'
    compileSdk 35
    defaultConfig {
        applicationId 'org.pusingcuk.studio'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '0.6-dev'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    androidResources { noCompress += ['pusingcuk-native'] }
}
