services:
  pusingcuk:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: pusingcuk:dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      CC: ${CC:-gcc}
    command: ["test"]

  bootstrap:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: pusingcuk:dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["run-native-compile", "FILE=examples/self_hosting/evaluator.cuk"]
